<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #6 — Electric Plasma | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    <div class="demo-nav">
        <a href="/">← Главная</a>
        <a href="/1">1 Matrix</a>
        <a href="/2">2 Warp</a>
        <a href="/3">3 Fluid</a>
        <a href="/4">4 Synthwave</a>
        <a href="/5">5 Nodes</a>
        <a href="/6" class="active">6 Plasma</a>
        <a href="/7">7 Vortex</a>
        <a href="/8">8 HUD</a>
        <a href="/9">9 Aurora</a>
        <a href="/10">10 Mandala</a>
    </div>

    <canvas id="plasmaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('plasmaCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        let t = 0;

        function drawPlasma() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, w, h);

            t += 0.03;

            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = `hsl(${(t * 40 + i * 50) % 360}, 100%, 60%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.strokeStyle;

                for (let x = 0; x < w; x += 10) {
                    const y = h / 2 + Math.sin(x * 0.008 + t + i) * 120 + Math.cos(x * 0.015 - t) * 60;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(drawPlasma);
        }

        drawPlasma();
    </script>
</body>
</html>
