<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #7 — Black Hole Vortex | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #030206; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    <div class="demo-nav">
        <a href="/">← Главная</a>
        <a href="/1">1 Matrix</a>
        <a href="/2">2 Warp</a>
        <a href="/3">3 Fluid</a>
        <a href="/4">4 Synthwave</a>
        <a href="/5">5 Nodes</a>
        <a href="/6">6 Plasma</a>
        <a href="/7" class="active">7 Vortex</a>
        <a href="/8">8 HUD</a>
        <a href="/9">9 Aurora</a>
        <a href="/10">10 Mandala</a>
    </div>

    <canvas id="vortexCanvas"></canvas>

    <script>
        const canvas = document.getElementById('vortexCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        const particles = [];
        const numP = 400;

        for (let i = 0; i < numP; i++) {
            particles.push({
                angle: Math.random() * Math.PI * 2,
                dist: Math.random() * Math.min(w, h) * 0.4 + 40,
                speed: Math.random() * 0.02 + 0.005,
                radius: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? '#00f2fe' : '#7f00ff'
            });
        }

        function drawVortex() {
            ctx.fillStyle = 'rgba(3, 2, 6, 0.2)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;

            // Black hole core
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#7f00ff';
            ctx.fill();

            particles.forEach(p => {
                p.angle += p.speed;
                p.dist -= 0.2;

                if (p.dist <= 30) {
                    p.dist = Math.min(w, h) * 0.45;
                }

                const x = cx + Math.cos(p.angle) * p.dist;
                const y = cy + Math.sin(p.angle) * p.dist;

                ctx.beginPath();
                ctx.arc(x, y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });

            requestAnimationFrame(drawVortex);
        }

        drawVortex();
    </script>
</body>
</html>
