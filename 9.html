<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #9 — Aurora Waves | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #040814; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    

    <canvas id="auroraCanvas"></canvas>

    <script>
        const canvas = document.getElementById('auroraCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        let step = 0;

        function drawAurora() {
            ctx.fillStyle = '#040814';
            ctx.fillRect(0, 0, w, h);

            step += 0.015;

            for (let i = 0; i < 3; i++) {
                const grad = ctx.createLinearGradient(0, 0, w, h);
                if (i === 0) { grad.addColorStop(0, 'rgba(0, 242, 254, 0.4)'); grad.addColorStop(1, 'rgba(127, 0, 255, 0.1)'); }
                else if (i === 1) { grad.addColorStop(0, 'rgba(0, 230, 118, 0.35)'); grad.addColorStop(1, 'rgba(0, 242, 254, 0.1)'); }
                else { grad.addColorStop(0, 'rgba(255, 0, 127, 0.3)'); grad.addColorStop(1, 'rgba(0, 230, 118, 0.1)'); }

                ctx.beginPath();
                ctx.moveTo(0, h * 0.4);

                for (let x = 0; x <= w; x += 20) {
                    const y = Math.sin(x * 0.003 + step + i) * 100 + Math.cos(x * 0.006 - step) * 60 + h * (0.3 + i * 0.15);
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.fillStyle = grad;
                ctx.fill();
            }

            requestAnimationFrame(drawAurora);
        }

        drawAurora();
    </script>
</body>
</html>
