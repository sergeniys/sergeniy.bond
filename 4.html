<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #4 — Synthwave Grid | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #0b0217; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    

    <canvas id="synthCanvas"></canvas>

    <script>
        const canvas = document.getElementById('synthCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        let offset = 0;

        function draw() {
            ctx.fillStyle = '#0b0217';
            ctx.fillRect(0, 0, w, h);

            // Sun
            const sunY = h * 0.45;
            const grad = ctx.createLinearGradient(0, sunY - 120, 0, sunY + 120);
            grad.addColorStop(0, '#ffd600');
            grad.addColorStop(1, '#ff007f');

            ctx.beginPath();
            ctx.arc(w / 2, sunY, 120, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff007f';
            ctx.fill();

            // Horizon Line
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, sunY);
            ctx.lineTo(w, sunY);
            ctx.stroke();

            // Grid Lines
            offset = (offset + 1.5) % 40;
            const horizon = sunY;
            
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00f2fe';

            // Vertical Perspective Lines
            for (let x = -w; x < w * 2; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(w / 2 + (x - w / 2) * 0.05, horizon);
                ctx.stroke();
            }

            // Moving Horizontal Lines
            for (let y = horizon; y < h; y += 15 + (y - horizon) * 0.15) {
                ctx.beginPath();
                ctx.moveTo(0, y + offset);
                ctx.lineTo(w, y + offset);
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
