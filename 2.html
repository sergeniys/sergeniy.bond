<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #2 — 3D Hyper-Warp Starfield | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #05050c; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    <div class="demo-nav">
        <a href="/">← Главная</a>
        <a href="/1">1 Matrix</a>
        <a href="/2" class="active">2 Warp</a>
        <a href="/3">3 Fluid</a>
        <a href="/4">4 Synthwave</a>
        <a href="/5">5 Nodes</a>
        <a href="/6">6 Plasma</a>
        <a href="/7">7 Vortex</a>
        <a href="/8">8 HUD</a>
        <a href="/9">9 Aurora</a>
        <a href="/10">10 Mandala</a>
    </div>

    <canvas id="warpCanvas"></canvas>

    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        const numStars = 800;
        const stars = [];
        let speed = 12;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: (Math.random() - 0.5) * w * 2,
                y: (Math.random() - 0.5) * h * 2,
                z: Math.random() * w
            });
        }

        function loop() {
            ctx.fillStyle = 'rgba(5, 5, 12, 0.25)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;

            stars.forEach(star => {
                star.z -= speed;
                if (star.z <= 0) {
                    star.z = w;
                    star.x = (Math.random() - 0.5) * w * 2;
                    star.y = (Math.random() - 0.5) * h * 2;
                }

                const k = 128 / star.z;
                const px = star.x * k + cx;
                const py = star.y * k + cy;

                if (px >= 0 && px <= w && py >= 0 && py <= h) {
                    const size = (1 - star.z / w) * 3 + 0.5;
                    const alpha = (1 - star.z / w);
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00f2fe';
                    ctx.fill();
                }
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
