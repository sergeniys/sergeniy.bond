<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #1 — Matrix Rain | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    

    <canvas id="matrixCanvas"></canvas>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ'.split('');
        const fontSize = 16;
        const columns = Math.floor(w / fontSize);
        const drops = Array(columns).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = '#00f2fe';
            ctx.font = fontSize + 'px "Fira Code", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > h && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
