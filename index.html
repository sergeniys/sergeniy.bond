<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>serg — Personal Portal</title>
    <meta name="description" content="Официальный портал serg.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Ambient Lighting & Grid -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="grid-pattern"></div>

    <!-- Quick Top Bar / Actions -->
    <div class="home-top-bar container">
        <a href="#contact" class="bg-switcher-btn">💬 Контакты</a>
    </div>

    <main class="home-minimal-container">
        <div class="container">
            <h1 class="minimal-title">
                <span class="brand-code">&lt;</span>serg<span class="brand-code"> /&gt;</span>
            </h1>
            <p class="minimal-subtitle">
                Персональный веб-портал Сергея Карцева.
            </p>
        </div>
    </main>

    <!-- Contact Section -->
    <section id="contact" class="section">
        <div class="container">
            <div class="contact-box glass-card" style="text-align: center;">
                <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 12px;">Контакты</h2>
                <p style="color: var(--text-muted); margin-bottom: 28px;">Связь со мной:</p>

                <div class="contact-methods">
                    <a href="https://t.me/Ssergeniy" target="_blank" rel="noopener" class="contact-card">
                        <div class="contact-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2L2 9.5l7.5 3L17 6l-5.5 8.5L17 21z"/></svg>
                        </div>
                        <div class="contact-info">
                            <span class="contact-label">Telegram</span>
                            <span class="contact-value">@Ssergeniy</span>
                        </div>
                    </a>

                    <a href="https://github.com/sergeniys" target="_blank" rel="noopener" class="contact-card">
                        <div class="contact-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                        </div>
                        <div class="contact-info">
                            <span class="contact-label">GitHub</span>
                            <span class="contact-value">github.com/sergeniys</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <p>© <span id="currentYear">2026</span> serg. Domain <a href="https://sergeniy.bond" target="_blank" class="footer-link">sergeniy.bond</a>.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
