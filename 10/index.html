<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background #10 — Kaleidoscope Mandala | serg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { margin: 0; overflow: hidden; background: #05040a; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .demo-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 6px; background: rgba(0,0,0,0.8);
            padding: 10px 16px; border-radius: 30px; border: 1px solid rgba(0,242,254,0.4);
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .demo-nav a {
            color: #94a3b8; text-decoration: none; padding: 4px 10px; border-radius: 12px;
            font-family: 'Fira Code', monospace; font-size: 0.85rem; font-weight: 600;
        }
        .demo-nav a:hover, .demo-nav a.active { color: #00f2fe; background: rgba(0,242,254,0.15); }
    </style>
</head>
<body>
    

    <canvas id="mandalaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mandalaCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        let rotation = 0;

        function drawMandala() {
            ctx.fillStyle = 'rgba(5, 4, 10, 0.15)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            rotation += 0.008;

            ctx.save();
            ctx.translate(cx, cy);

            const petals = 12;
            for (let i = 0; i < petals; i++) {
                ctx.rotate((Math.PI * 2) / petals);

                ctx.strokeStyle = `hsl(${(rotation * 60 + i * 30) % 360}, 100%, 65%)`;
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = ctx.strokeStyle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(80 + Math.sin(rotation * 2) * 30, 120, 0, 240);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 160 + Math.sin(rotation) * 40, 18, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
            requestAnimationFrame(drawMandala);
        }

        drawMandala();
    </script>
</body>
</html>
